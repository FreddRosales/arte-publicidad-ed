<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso del personal · Arte y Publicidad E&amp;D</title>
  <meta name="description" content="Acceso al espacio de trabajo de la empresa.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="login" data-layout="staff">
  <div id="site-header"></div>

  <main id="contenido" tabindex="-1" class="container py-4">
    <div class="row g-0 border rounded-4 overflow-hidden bg-white" style="max-width:980px;margin:auto">
      <div class="col-lg-6 login-art d-none d-lg-block" aria-hidden="true"><img src="assets/img/Login.jpeg" alt="" class="login-foto"></div>
      <div class="col-lg-6 p-4 p-md-5">
        <i class="bi bi-lock fs-3 text-primary" aria-hidden="true"></i>
        <h1 class="h3 mt-2">Ingreso del personal</h1>
        <p class="text-muted">Ingresa con tu cuenta para acceder al espacio de trabajo.</p>
        <div class="alert alert-danger d-none" id="login-error" role="alert"></div>
        <form id="form-login" novalidate>
          <div class="mb-3"><label class="form-label" for="usuario">Usuario o correo</label><input class="form-control" id="usuario" autocomplete="username" required></div>
          <div class="mb-1"><label class="form-label" for="clave">Contraseña</label>
            <div class="input-group"><input class="form-control" id="clave" type="password" autocomplete="current-password" required>
              <button class="btn btn-outline-primary" type="button" id="ver-clave" aria-pressed="false" aria-label="Mostrar contraseña"><i class="bi bi-eye" aria-hidden="true"></i></button></div></div>
          <button class="btn btn-primary w-100 mt-3" type="submit">Ingresar</button>
        </form>
        <details class="mt-4 small"><summary>Usuarios de demostración</summary>
          <p class="mb-1 mt-2">Prototipo sin servidor. Estas cuentas son solo de prueba:</p>
          <ul class="mb-0"><li>Administrador: <code>admin</code> / <code>admin123</code></li><li>Diseñador: <code>diego</code> / <code>diseno123</code></li></ul>
        </details>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
