<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fechas disponibles · Arte y Publicidad E&amp;D</title>
  <meta name="description" content="Consulta referencial de fechas disponibles para eventos.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="eventos">
  <div id="site-header"></div>

  <main id="contenido" tabindex="-1" class="container py-4" style="max-width:880px">
    <nav aria-label="Ruta de navegación"><ol class="breadcrumb small"><li class="breadcrumb-item"><a href="index.html">Inicio</a></li><li class="breadcrumb-item active" aria-current="page">Fechas disponibles</li></ol></nav>
    <h1 class="h2 mb-1">Fechas disponibles</h1>
    <p class="text-muted mb-4">Para bodas, quince años y sesiones fotográficas. <strong>Es una consulta referencial, no una reserva.</strong></p>

    <div class="row g-4">
      <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <button class="btn btn-outline-primary btn-sm" id="mes-ant" aria-label="Mes anterior"><i class="bi bi-chevron-left" aria-hidden="true"></i></button>
          <h2 class="h5 mb-0" id="mes-titulo" aria-live="polite"></h2>
          <button class="btn btn-outline-primary btn-sm" id="mes-sig" aria-label="Mes siguiente"><i class="bi bi-chevron-right" aria-hidden="true"></i></button>
        </div>
        <table class="cal" aria-labelledby="mes-titulo">
          <thead><tr id="cal-head"></tr></thead>
          <tbody id="cal-body"></tbody>
        </table>
        <p class="mt-3 mb-0 small"><span class="legend-box"></span>Disponible &nbsp; <span class="legend-box no"></span>No disponible</p>
      </div>
      <div class="col-lg-5">
        <div class="summary-box" aria-live="polite" id="detalle-fecha">
          <h2 class="h6">Fecha elegida</h2>
          <p class="mb-0 text-muted">Toca un día disponible para continuar.</p>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/eventos.js"></script>
</body>
</html>
