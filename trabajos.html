<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis trabajos asignados · Arte y Publicidad E&amp;D</title>
  <meta name="description" content="Trabajos asignados al diseñador con fechas de entrega.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="trabajos" data-layout="staff">
  <div id="site-header"></div>

  <div class="panel-wrap">
  <main id="contenido" tabindex="-1" class="container py-4">
    <h1 class="h3 mb-1">Mis trabajos asignados</h1>
    <p class="text-muted mb-4">Organiza tus entregas y actualiza el avance de cada proyecto.</p>
    <div class="row g-3">
      <div class="col-lg-5"><section class="panel-card" aria-labelledby="h-lt">
        <div class="d-flex justify-content-between align-items-center mb-2"><h2 class="h6 mb-0" id="h-lt">Lista de trabajos</h2><span class="small text-muted">Ordenados por fecha de entrega</span></div>
        <ul class="list-req" id="lista-trab"></ul></section></div>
      <div class="col-lg-7"><section class="panel-card" aria-labelledby="h-ft"><h2 class="h6" id="h-ft">Ficha completa del pedido</h2>
        <div id="ficha-trab"><p class="text-muted mb-0">Elige un trabajo de la lista.</p></div>
        <div id="cambio-trab" hidden class="mt-3">
          <p class="fw-semibold mb-2" id="lbl-estado">Cambiar estado</p>
          <div id="picker-trab" aria-labelledby="lbl-estado"></div>
          <button class="btn btn-primary mt-3" id="guardar-trab" type="button">Guardar estado</button>
          <p class="small text-muted mt-2 mb-0">El cliente verá la actualización al consultar su número de solicitud.</p>
        </div></section></div>
    </div>
  </main>
  </div>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/trabajos.js"></script>
</body>
</html>
