<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seguimiento de pedido · Arte y Publicidad E&amp;D</title>
  <meta name="description" content="Consulta en qué etapa está tu pedido con tu número de solicitud.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link href="vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="vendor/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body data-page="seguimiento">
  <div id="site-header"></div>

  <main id="contenido" tabindex="-1" class="container py-4" style="max-width:860px">
    <nav aria-label="Ruta de navegación"><ol class="breadcrumb small"><li class="breadcrumb-item"><a href="index.html">Inicio</a></li><li class="breadcrumb-item active" aria-current="page">Mi pedido</li></ol></nav>
    <h1 class="h2 mb-1">¿Cómo va tu pedido?</h1>
    <p class="text-muted mb-4">Escribe tu número de solicitud (por ejemplo AP-0001).</p>

    <form class="row g-2 align-items-end mb-4" id="form-seg" novalidate>
      <div class="col-12 col-sm"><label class="form-label" for="numero">Número de solicitud</label>
        <input class="form-control" id="numero" name="numero" placeholder="AP-0001" autocomplete="off" aria-describedby="e-numero" required>
        <div class="invalid-feedback" id="e-numero">Escribe tu número de solicitud.</div></div>
      <div class="col-12 col-sm-auto"><button class="btn btn-accent w-100" type="submit"><i class="bi bi-search" aria-hidden="true"></i> Consultar</button></div>
    </form>

    <div id="resultado" aria-live="polite"></div>
  </main>

  <div id="site-footer"></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/analitica.js"></script>
  <script src="js/seguimiento.js"></script>
  <script src="js/animaciones.js"></script>
</body>
</html>
